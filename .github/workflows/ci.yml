name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Verify generated registry
        run: |
          bun run registry:build
          git diff --exit-code -- registry.json src/lib/m3/component-sources.generated.ts
      - name: Check registry contract
        run: bun run registry:check
      - name: Validate shadcn registry
        run: bun run registry:validate
      - name: Test clean registry consumer
        run: bun run registry:smoke
      - name: Build catalog
        run: bun run build
