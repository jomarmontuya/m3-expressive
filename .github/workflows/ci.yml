name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Build npm package (m3-expressive-react)
        run: bun run build:package
      - name: Visual regression check
        run: |
          bunx playwright install chromium --with-deps || true
          bun run vr:baseline
          bun run vr:check
      - name: Upload VR report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vr-report
          path: |
            tool-results/vr-report.json
            tool-results/vr-current/
