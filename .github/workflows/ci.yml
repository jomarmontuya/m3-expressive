name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Build npm package (m3-expressive-react)
        run: bun run build:package
      - name: Install agent-browser Chromium and system dependencies
        run: bunx agent-browser install --with-deps
      - name: Visual regression check
        shell: bash
        run: |
          bun run dev &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent --show-error "http://localhost:3000/api/registry?summary=true" > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat dev.log
            exit 1
          fi
          bun run vr:check
      - name: Upload VR report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vr-report
          path: |
            tool-results/vr-report.json
            tool-results/vr-current/
