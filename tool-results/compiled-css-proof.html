<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>m3-expressive-react — compiled.css proof (no Tailwind)</title>
<!-- The ONLY stylesheet: the npm package's compiled variant.
     No Tailwind, no build step, no other CSS of any kind. -->
<link rel="stylesheet" href="../packages/m3-expressive-react/dist/compiled.css" />
<style>/* consumer's own CSS — must survive untouched (no preflight) */
  .consumer-note { font-family: Georgia, serif; font-style: italic; }
</style>
</head>
<body style="padding:32px; display:grid; gap:20px; justify-items:start">

  <h1 class="md-headline-small text-m3-on-surface">compiled.css standalone proof</h1>
  <p class="md-body-medium text-m3-on-surface-variant consumer-note">
    Static page, zero Tailwind — tokens + helpers + utilities from one compiled file.
  </p>

  <div style="display:flex; gap:12px; align-items:center">
    <button id="filled" class="m3-state m3-focus md-label-large bg-m3-primary text-m3-on-primary rounded-full inline-flex select-none items-center justify-center transition-colors" style="height:56px;padding:0 24px;gap:8px;border:0">
      <span class="material-symbols-rounded" style="font-size:20px">edit</span>
      Create
    </button>
    <button id="tonal" class="m3-state m3-focus md-label-large bg-m3-secondary-container text-m3-on-secondary-container rounded-full inline-flex select-none items-center justify-center" style="height:56px;padding:0 24px;gap:8px;border:0">
      Tonal
    </button>
    <button id="disabled" class="m3-state md-label-large bg-m3-on-surface/12 text-m3-on-surface/38 rounded-full inline-flex select-none items-center justify-center" style="height:56px;padding:0 24px;gap:8px;border:0;pointer-events:none">
      Disabled
    </button>
  </div>

  <div id="card" class="m3-elevation-1 bg-m3-surface-container-low rounded-m3-xs md-body-large text-m3-on-surface" style="padding:20px;max-width:420px">
    Card body on <code>bg-m3-surface-container-low</code> with <code>rounded-m3-xs</code> + <code>m3-elevation-1</code>.
  </div>

  <div style="display:flex; gap:10px; align-items:center">
    <span class="md-label-small bg-m3-primary-container text-m3-on-primary-container rounded-m3-xs" style="padding:4px 10px">rounded-m3-xs chip</span>
    <span id="scrimchip" class="md-label-small text-m3-on-surface bg-m3-scrim/32" style="padding:4px 10px">bg-m3-scrim/32</span>
  </div>

</body>
</html>
